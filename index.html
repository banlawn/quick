<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#eef1f8">
<title>kuaijietiaozhuan</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #101838;
    --ink-soft: #606b94;
    /* 液态玻璃基底参数升级 */
    --glass-fill: rgba(255,255,255,0.06);
    --glass-fill-hover: rgba(255,255,255,0.09);
    --blur-depth: 42px;
    --saturate-lens: 200%;
    --fresnel-rim: rgba(255,255,255,0.16);
    --top-specular: rgba(255,255,255,0.26);
    --bottom-thickness: rgba(0,0,0,0.04);
    --distort-scale: 7.5;
    --distort-scale-hover: 11;
    --fresnel-edge: rgba(255, 255, 255, 0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #e6f0ff 0%, #f3eaff 100%);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  /* 背景图片层，自动加载同目录ground.png */
  .bg-image {
    position: fixed;
    inset: 0;
    z-index: -2;
    background-image: url("ground.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .bg-image.loaded {
    opacity: 1;
  }

  /* 流体彩泡层，有背景图时弱化 */
  .bg-blob-wrap {
    position: fixed;
    inset: 0;
    z-index: -1;
    transition: opacity 0.6s ease;
  }
  body.has-ground .bg-blob-wrap {
    opacity: 0.2;
  }

  .bg-blob {
    position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.65; pointer-events: none;
    animation: liquidDrift 24s ease-in-out infinite alternate;
  }
  .blob-1 { width: 460px; height: 460px; background: #70a8ff; top: -160px; left: -130px; animation-delay: 0s; }
  .blob-2 { width: 420px; height: 420px; background: #ffb8d8; bottom: -130px; right: -120px; animation-delay: -9s; }
  .blob-3 { width: 380px; height: 380px; background: #d2b8ff; top: 30%; left: 35%; animation-delay: -15s; }
  .blob-4 { width: 330px; height: 330px; background: #b8e2ff; top: 68%; right: 18%; opacity: 0.32; animation-delay: -7s; }

  @keyframes liquidDrift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(70px, -50px) scale(1.18); }
    100% { transform: translate(-40px, 35px) scale(0.88); }
  }

  .wrap {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: calc(var(--safe-top) + 40px) 26px calc(var(--safe-bottom) + 40px);
  }

  .header { text-align: center; }
  .logo {
    width: 78px; height: 78px; margin: 0 auto 20px;
    border-radius: 24px;
    background: linear-gradient(135deg, #4f8cff, #a44bff);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 30px rgba(79,140,255,.35);
    animation: pop .6s cubic-bezier(.2,.8,.3,1.2) both;
    /* 同步液态玻璃滤镜 */
    filter: url(#liquidGlassDistort);
  }
  .logo svg { width: 40px; height: 40px; fill: #fff; }
  .title { font-size: 26px; font-weight: 800; letter-spacing: 3px; animation: pop .6s .06s cubic-bezier(.2,.8,.3,1.2) both; }
  .subtitle { font-size: 14px; color: var(--ink-soft); margin-top: 10px; animation: pop .6s .12s cubic-bezier(.2,.8,.3,1.2) both; }

  .players { display: flex; flex-direction: column; gap: 28px; margin: 36px 0 28px; }

  /* 苹果WWDC25液态玻璃核心按钮【重度美化升级】 */
  .player-btn {
    display: flex; align-items: center; gap: 16px;
    padding: 24px 24px;
    border-radius: 32px;
    text-decoration: none; color: var(--ink);
    background: var(--glass-fill);
    /* 多层复合液态滤镜 + 磨砂模糊 + 色彩饱和透镜 */
    backdrop-filter: url(#liquidGlassDistort) blur(var(--blur-depth)) saturate(var(--saturate-lens));
    -webkit-backdrop-filter: url(#liquidGlassDistort) blur(var(--blur-depth)) saturate(var(--saturate-lens));
    /* 四层立体玻璃光影：外阴影+顶部高光+边缘菲涅尔折射边框+底部厚度阴影 */
    box-shadow:
      0 14px 48px rgba(10, 16, 45, 0.04),
      inset 0 1.4px 0 var(--top-specular),
      inset 0 0 0 1px var(--fresnel-rim),
      inset 0 -1.4px 0 var(--bottom-thickness);
    position: relative; overflow: hidden;
    transition: all 0.38s cubic-bezier(0.2, 0, 0.2, 1);
    animation: slideUp .5s both;
    isolation: isolate;
    cursor: pointer;
    /* 边缘液态膨胀基础 */
    border: 1px solid transparent;
  }
  .player-btn:nth-child(1) { animation-delay: .18s; }
  .player-btn:nth-child(2) { animation-delay: .26s; }

  .player-btn:hover {
    transform: translateY(-10px) scale(1.018);
    background: var(--glass-fill-hover);
    --distort-scale: var(--distort-scale-hover);
    box-shadow:
      0 26px 66px rgba(10, 16, 45, 0.07),
      inset 0 1.4px 0 rgba(255,255,255,0.32),
      inset 0 0 0 1px var(--fresnel-edge),
      inset 0 -1.4px 0 rgba(0,0,0,0.02);
  }
  .player-btn:active { transform: scale(0.94) translateY(0); box-shadow: 0 6px 24px rgba(10, 16, 45, 0.03); }

  /* 顶部静态菲涅尔高光层 */
  .player-btn::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 35%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.14), transparent);
    border-radius: inherit;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  /* Hover动态扫光（液态流动反光） */
  .player-btn::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(105deg, transparent 32%, rgba(255,255,255,0.22) 48%, rgba(255,255,255,0.08) 54%, transparent 70%);
    transform: skewX(-30deg) translateX(-140%);
    transition: transform 1.1s ease;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .player-btn:hover::after { transform: skewX(-30deg) translateX(140%); }

  .icon {
    width: 54px; height: 54px; flex-shrink: 0;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.35);
    filter: url(#liquidGlassDistortMini);
  }
  .icon svg { width: 24px; height: 24px; fill: #fff; }
  .p1 .icon { background: linear-gradient(135deg, #4f8cff, #2f6bff); box-shadow: 0 8px 18px rgba(47,107,255,.4); }
  .p2 .icon { background: linear-gradient(135deg, #ff6b9d, #c23bff); box-shadow: 0 8px 18px rgba(194,59,255,.4); }

  .info { text-align: left; flex: 1; }
  .info .name { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: linear-gradient(135deg, #4f8cff, #a44bff); color: #fff;
    filter: url(#liquidGlassDistortMini);
  }
  .info .desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }
  .arrow {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(28,36,64,.06);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: 18px; flex-shrink: 0;
    transition: all 0.3s ease;
    filter: url(#liquidGlassDistortMini);
  }
  .player-btn:hover .arrow { background: rgba(79,140,255,0.16); color: #4f8cff; }

  .footer {
    text-align: center; font-size: 12px; color: var(--ink-soft);
    line-height: 1.7;
    animation: pop .6s .4s both;
  }
  .footer .tip { display: inline-flex; align-items: center; gap: 6px; }
  .footer .dot { width: 6px; height: 6px; border-radius: 50%; background: #35d07f; box-shadow: 0 0 8px #35d07f; }

  @keyframes pop { from{ opacity:0; transform: translateY(12px) scale(.96) } to{ opacity:1; transform: none } }
  @keyframes slideUp { from{ opacity:0; transform: translateY(24px) } to{ opacity:1; transform: none } }

  /* ===================== 全屏iframe容器（同步液态玻璃风格） ===================== */
  .fullscreen-view {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(14px) saturate(160%);
    opacity: 0;
    pointer-events: none;
    transform: scale(0.92);
    transition: all 0.4s cubic-bezier(0.2,0,0.2,1);
  }
  .fullscreen-view.active {
    opacity: 1;
    pointer-events: all;
    transform: scale(1);
  }
  /* 右上角返回按钮，液态玻璃统一样式 */
  .back-btn {
    position: fixed;
    top: calc(var(--safe-top) + 16px);
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.22);
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1000;
    transition: all 0.2s ease;
    filter: url(#liquidGlassDistortMini);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.28);
    transform: scale(1.08);
  }
  /* 全屏网页iframe */
  .page-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  /* 加载提示文字 */
  .loading-tip {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 16px;
    display: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .fullscreen-view.loading .loading-tip {
    display: block;
  }
</style>
</head>
<body>
<!-- SVG液态玻璃光学复合滤镜【升级分层渲染：噪点→柔化置换→高斯模糊→菲涅尔提亮→轻微锐化】 -->
<svg width="0" height="0" style="position:absolute;overflow:hidden;">
  <defs>
    <!-- 主液态玻璃滤镜：卡片大组件使用，强折射边缘变形 -->
    <filter id="liquidGlassDistort" x="-12%" y="-12%" width="124%" height="124%">
      <!-- 1. 生成分层分形噪点，自然液态纹理 -->
      <feTurbulence type="fractalNoise" baseFrequency="0.0055" numOctaves="3" seed="6" result="rawNoise"/>
      <!-- 2. 噪点柔化，消除锯齿扭曲 -->
      <feGaussianBlur in="rawNoise" stdDeviation="2" result="smoothNoise"/>
      <!-- 3. 核心置换映射：边缘折射变形，匹配WWDC25液态膨胀 -->
      <feDisplacementMap
        in="SourceGraphic"
        in2="smoothNoise"
        scale="var(--distort-scale)"
        xChannelSelector="R"
        yChannelSelector="G"
        result="distortLayer"/>
      <!-- 4. 菲涅尔高光提亮，模拟玻璃反光 -->
      <feComposite in="distortLayer" operator="arithmetic" k1="0" k2="0.92" k3="0.22" k4="0" result="brightGlass"/>
      <!-- 5. 轻微锐化修复文字模糊问题 -->
      <feUnsharpMask stdDeviation="0.7" amount="0.55"/>
    </filter>

    <!-- 小型元素专用迷你液态滤镜：图标、按钮、徽章，弱扭曲不破坏细节 -->
    <filter id="liquidGlassDistortMini" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3" result="miniNoise"/>
      <feGaussianBlur in="miniNoise" stdDeviation="1" result="miniSmooth"/>
      <feDisplacementMap
        in="SourceGraphic"
        in2="miniSmooth"
        scale="3.5"
        xChannelSelector="R"
        yChannelSelector="G"
        result="miniDistort"/>
      <feComposite in="miniDistort" operator="arithmetic" k1="0" k2="0.96" k3="0.14" k4="0"/>
    </filter>
  </defs>
</svg>

<!-- 全屏页面容器（默认隐藏） -->
<div class="fullscreen-view">
  <div class="back-btn">×</div>
  <div class="loading-tip">页面加载中，部分网站禁止内嵌会自动新开标签页</div>
  <iframe class="page-iframe" src=""></iframe>
</div>

<!-- 自动加载同目录ground.png背景 -->
<div class="bg-image"></div>
<div class="bg-blob-wrap">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div class="bg-blob blob-4"></div>
</div>

<div class="wrap">
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="title">播放器导航</div>
    <div class="subtitle">请选择线路进入播放</div>
  </div>

  <div class="players">
    <!-- data-href 存放要加载的网址 -->
    <div class="player-btn p1" data-href="https://ek.saygugugugaga.dpdns.org">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
      </span>
      <span class="info">
        <span class="name">播放器① <span class="badge">推荐</span></span>
        <span class="desc">高清线路 · 秒开流畅</span>
      </span>
      <span class="arrow">›</span>
    </div>

    <div class="player-btn p2" data-href="https://disk.saygugugaga.dpdns.org/">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
      </span>
      <span class="info">
        <span class="name">播放器②</span>
        <span class="desc">备用线路 · 卡顿切换这里</span>
      </span>
      <span class="arrow">›</span>
    </div>
  </div>

  <div class="footer">
    <span class="tip"><span class="dot"></span>线路正常</span><br>
    如无法播放，请切换另一个播放器
  </div>
</div>

<script>
// 1. 自动检测同目录 ground.png
const bgImgEl = document.querySelector('.bg-image');
const img = new Image();
img.src = 'ground.png';
img.onload = () => {
  document.body.classList.add('has-ground');
  bgImgEl.classList.add('loaded');
};
img.onerror = () => {
  console.log('未检测到同目录 ground.png，使用默认流体彩泡背景');
};

// 2. 全屏iframe交互逻辑（新增跨域兜底方案）
const fullView = document.querySelector('.fullscreen-view');
const iframe = document.querySelector('.page-iframe');
const backBtn = document.querySelector('.back-btn');
const btnList = document.querySelectorAll('.player-btn');
const loadingTip = document.querySelector('.loading-tip');

// 点击按钮打开全屏页面
btnList.forEach(btn => {
  btn.addEventListener('click', () => {
    const targetUrl = btn.dataset.href;
    fullView.classList.add('active', 'loading');
    iframe.src = targetUrl;

    // 5秒检测iframe加载失败（跨域拦截），自动新开标签兜底
    setTimeout(() => {
      try {
        // 跨域网站会报错，触发catch
        const test = iframe.contentDocument;
        fullView.classList.remove('loading');
      } catch (err) {
        // 跨域被拦截，自动新开标签
        window.open(targetUrl, '_blank');
        alert('当前网站禁止内嵌，已自动在新标签打开页面');
      }
    }, 4000);
  })
})

// 点击返回按钮关闭全屏
backBtn.addEventListener('click', () => {
  fullView.classList.remove('active', 'loading');
  // 清空iframe，节省资源
  iframe.src = '';
})
</script>
